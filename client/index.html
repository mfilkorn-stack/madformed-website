    <!-- FAQPage JSON-LD (static for crawlers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Worauf ist MadforMed spezialisiert?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MadforMed GmbH ist eine spezialisierte B2B-Beratungsgesellschaft mit Sitz in Leverkusen. Wir beraten Unternehmen in den Bereichen medizinisches Cannabis (EU-GMP/GDP, Supply Chain, Market Access), Medizintechnik (Go-to-Market, Sales Enablement, Prozessoptimierung), Medizinalhandel (Distribution, Sortimentsgestaltung, Herstellerverhandlungen) und KI-Enablement für Vertriebsteams (Copilot, ChatGPT, Prompt-Engineering)."
          }
        },
        {
          "@type": "Question",
          "name": "In welcher Region ist MadforMed tätig?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MadforMed ist primär im DACH-Raum (Deutschland, Österreich, Schweiz) tätig. Unser Sitz ist in Leverkusen (NRW). Wir begleiten Projekte deutschlandweit vor Ort und arbeiten auch mit internationalen Mandanten, insbesondere bei Cannabis-Import/Export und Medizintechnik-Markteintrittsprojekten."
          }
        },
        {
          "@type": "Question",
          "name": "Was bedeutet KI-Enablement für Vertriebsteams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KI-Enablement bedeutet, Vertriebsmitarbeiter im Umgang mit KI-Tools wie Microsoft Copilot und ChatGPT zu schulen. Wir bieten drei Workshop-Formate: Kickstart (2h Impuls), Team-Workshop (halber Tag) und ein 4-Wochen-Enablement-Programm. Jeder Teilnehmer erhält ein Prompt-Playbook mit über 20 praxiserprobten Vorlagen für Akquise, Angebotserstellung und Kundenkommunikation."
          }
        },
        {
          "@type": "Question",
          "name": "Bietet MadforMed Rechtsberatung oder medizinische Beratung an?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nein. MadforMed bietet keine Rechtsberatung, keine Steuerberatung und keine medizinische Beratung an. Unsere Leistungen umfassen ausschließlich strategische und operative Unternehmensberatung. Für rechtliche Fragen empfehlen wir spezialisierte Kanzleien."
          }
        },
        {
          "@type": "Question",
          "name": "Wie kann ich MadforMed kontaktieren?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sie erreichen uns per E-Mail unter matthias@madformed.de oder telefonisch unter 0176/22765249. Alternativ nutzen Sie unser Kontaktformular auf der Website. Wir melden uns in der Regel innerhalb von 48 Stunden zurück. MadforMed GmbH, Bonnerstraße 12, 51371 Leverkusen."
          }
        }
      ]
    }
    </script>
